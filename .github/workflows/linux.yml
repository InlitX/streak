name: Linux packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the Linux packages to, e.g. v1.9.0'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  linux:
    name: Build and attach
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    steps:
      - name: Install build dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl git jq unzip xz-utils zip file ca-certificates desktop-file-utils clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev lld

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package
        run: bash linux/package.sh

      - name: Add them to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            Streak-linux-x64.tar.gz
            Streak-x86_64.AppImage
