name: Build & Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # ABI splits keep each APK small (~15-20 MB) instead of one ~58 MB fat APK.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streak-apks
          path: build/app/outputs/flutter-apk/Streak-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only when manually dispatched with a tag. The release body is left empty
    # on purpose so it can be filled in by hand after publishing.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The app version comes entirely from the tag you type when running the
      # workflow: "v1.2.3" -> build-name 1.2.3. The Android versionCode uses the
      # workflow run number so every release is unique and increasing.
      - name: Build split APKs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-x86_64.apk

      # Clean source archive straight from the git tree (no build artifacts).
      - name: Package source code
        run: git archive --format=zip --prefix=streak-${{ inputs.tag }}/ -o Streak-source-${{ inputs.tag }}.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Streak ${{ inputs.tag }}
          files: |
            build/app/outputs/flutter-apk/Streak-arm64-v8a.apk
            build/app/outputs/flutter-apk/Streak-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Streak-x86_64.apk
            Streak-source-${{ inputs.tag }}.zip
