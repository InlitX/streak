name: Build & Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

# Pinned Flutter version. F-Droid extracts this exact value from the recipe so
# its build matches upstream. Defined once here and reused by both jobs.
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest
    # Only as a pull request check. A tagged run goes straight to release, which
    # builds and signs on its own, so nothing is compiled twice.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # ABI splits keep each APK small (~15-20 MB) instead of one ~58 MB fat APK.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streak-apks
          path: build/app/outputs/flutter-apk/Streak-*.apk
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    # Same rule as the release job: only a tagged run produces desktop builds.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # The zip carries a single Streak folder so unpacking it does not scatter
      # the engine, the plugins and the assets over the download directory.
      - name: Package
        run: |
          Rename-Item build/windows/x64/runner/Release Streak
          Compress-Archive -Path build/windows/x64/runner/Streak -DestinationPath Streak-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-windows
          path: Streak-windows-x64.zip
          if-no-files-found: error

  ios:
    name: Build iOS
    runs-on: macos-latest
    # Same rule as the windows job: only a tagged run produces an iOS build.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # There is no Apple developer account behind this app, so the build is
      # unsigned: it is for people who sideload it and sign it themselves.
      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # An .ipa is just a zip with the .app inside a Payload folder. Sideloadly
      # and AltStore take it from here.
      - name: Package
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qry Streak-ios.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-ios
          path: Streak-ios.ipa
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [windows, ios]
    # Only when manually dispatched with a tag. The notes are generated from the
    # merged pull requests, and the rest is filled in by hand after publishing.
    if: github.event_name == 'workflow_dispatch'

    # Reproducible build: keep the pub cache at a fixed path inside the workspace
    # (/home/runner/work/streak/streak/.pub-cache). F-Droid relocates its build to
    # this exact same path and uses the same PUB_CACHE, so the embedded paths match.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Reproducibility: the jni package bakes a unique build-id into libdartjni.so.
      # Force --build-id=none so the native lib is deterministic. F-Droid applies
      # this exact same patch in its recipe.
      - name: Patch jni build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Sign the release APKs with the release keystore (kept in GitHub Secrets)
      # so the published binaries match F-Droid's reproducible build.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/streak-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=streak-release.jks
          EOF

      # Reproducible build: version name AND code come entirely from pubspec.yaml
      # (1.1.0+2), exactly like F-Droid builds it. Do NOT pass --build-name or
      # --build-number here, or the APK won't match F-Droid's.
      # --split-debug-info moves the path-laden debug symbols out of libapp.so so it
      # builds deterministically. F-Droid uses the same flag.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-x86_64.apk

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: streak-windows

      - name: Download the iOS build
        uses: actions/download-artifact@v4
        with:
          name: streak-ios

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Streak-arm64-v8a.apk
            build/app/outputs/flutter-apk/Streak-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Streak-x86_64.apk
            Streak-windows-x64.zip
            Streak-ios.ipa
