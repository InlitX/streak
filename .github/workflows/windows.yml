name: Windows zip

# Builds the Windows app from whatever branch you launch this on. The zip and the
# installer are always kept as a run artifact; with a tag they are also attached
# to that release, which must already exist. Separate from build-apk.yml on
# purpose: re-running that one rebuilds and replaces the APKs, and those have to
# keep matching the commit the tag points at, or F-Droid's reproducible build breaks.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach to, e.g. v1.8.0. Empty = artifact only'
        required: false
        type: string
      signing:
        description: 'SignPath signing policy'
        required: true
        type: choice
        default: none
        options:
          - none
          - test-signing
          - release-signing

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.41.9'
  SIGNPATH_ORGANIZATION_ID: '56d04f3f-a39d-43ed-9e68-fb90ca3852d6'
  SIGNPATH_PROJECT: 'streak'

jobs:
  windows:
    name: Build and attach
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload the unsigned app
        id: unsigned-app
        if: inputs.signing != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: streak-windows-unsigned-app
          path: build/windows/x64/runner/Release/

      - name: Sign the app
        if: inputs.signing != 'none'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.signing }}
          artifact-configuration-slug: windows-portable
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed-app

      - name: Use the signed app
        if: inputs.signing != 'none'
        run: Copy-Item -Path build\signed-app\* -Destination build\windows\x64\runner\Release -Recurse -Force

      - name: Zip the build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Streak-windows-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build the installer
        run: |
          $version = '${{ inputs.tag }}'.TrimStart('v')
          if (-not $version) { $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value) }
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").FullName
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the unsigned installer
        id: unsigned-installer
        if: inputs.signing != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: streak-windows-unsigned-installer
          path: build/installer/Streak-windows-x64-setup.exe

      - name: Sign the installer
        if: inputs.signing != 'none'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.signing }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed-installer

      - name: Use the signed installer
        if: inputs.signing != 'none'
        run: Copy-Item -Path build\signed-installer\Streak-windows-x64-setup.exe -Destination build\installer -Force

      - name: Keep them as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-windows
          path: |
            Streak-windows-x64.zip
            build/installer/Streak-windows-x64-setup.exe

      - name: Add them to the release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            Streak-windows-x64.zip
            build/installer/Streak-windows-x64-setup.exe
