AuthorName: InlitX
WebSite: https://github.com/InlitX/streak
SourceCode: https://github.com/InlitX/streak
IssueTracker: https://github.com/InlitX/streak/issues
Donate: https://ko-fi.com/inlitx

RepoType: git
Repo: https://github.com/InlitX/streak.git

Builds:
  - versionName: 1.1.0
    versionCode: 2
    commit: v1.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.41.9
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build: $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version v%v
UpdateCheckMode: HTTP
UpdateCheckData: https://raw.githubusercontent.com/InlitX/streak/main/pubspec.yaml|version:\s.*\+(\d+)|https://raw.githubusercontent.com/InlitX/streak/main/pubspec.yaml|version:\s(.*)\+
