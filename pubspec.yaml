name: streak
description: "Streak: a minimal habit tracker that helps you build lasting streaks."

publish_to: 'none'

version: 2.6.0+17

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^3.6.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  # file_picker replaced wholesale by the SIG fork: upstream is not federated,
  # so the ohos adaptation cannot endorse it; file_picker_ohos is a drop-in
  # fork of 10.3.8 carrying android/ios/web/macos/windows/linux + ohos.
  # Imports use package:file_picker_ohos/file_picker_ohos.dart.
  file_picker_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_file_picker.git
      ref: 98af21560ef18e2bc428389e07c12ab7c17b98fb # br_v10.3.8_ohos
  fl_chart: ^0.69.2
  flutter_colorpicker: ^1.1.0
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.0.1
  hive_ce_flutter: ^2.3.3
  home_widget: ^0.8.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  lucide_icons_flutter: ^3.1.6
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  share_plus: ^10.1.4
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  uuid: ^4.5.2
  audioplayers: ^6.7.1
  gal: ^2.3.0
  local_auth: ^2.3.0
  wakelock_plus: ^1.5.2
  flip_board: ^1.0.0
  video_player_win: ^3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  permission_handler_windows:
    path: desktop/permission_handler_windows
  # --- OpenHarmony-SIG ohos plugin adapters (pinned refs, see notes.md) ---
  # SIG repo layout: each adaptation lives on a br_<pkg>-v<ver>_ohos release branch;
  # the app package pulls its *_ohos endorser via an in-repo git dependency.
  path_provider:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: d4e49daa0acbd0bc419d58b1da27d64d44fab54b # br_path_provider-v2.1.5_ohos
  path_provider_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider_ohos
      ref: d4e49daa0acbd0bc419d58b1da27d64d44fab54b
  url_launcher:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: ae4494a78db5a9e0fe760b0eba9231605ae45716 # br_url_launcher-v6.3.2_ohos
  url_launcher_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/url_launcher/url_launcher_ohos
      ref: ae4494a78db5a9e0fe760b0eba9231605ae45716
  image_picker:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: 1af98579e1a95d4fca19e422d26f5b6856ac38ba # br_image_picker-v1.2.1_ohos
  image_picker_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker_ohos
      ref: 1af98579e1a95d4fca19e422d26f5b6856ac38ba
  permission_handler:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_permission_handler.git
      path: permission_handler
      ref: c93847f008e387647311f4036bc705a4fc0b9560 # br_v12.0.1_ohos
  permission_handler_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_permission_handler.git
      path: permission_handler_ohos
      ref: c93847f008e387647311f4036bc705a4fc0b9560
  package_info_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: bc4df814a726042a9dad1a267ebb1d2973544e24 # br_package_info_plus-v9.0.0_ohos
  share_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins.git
      path: packages/share_plus/share_plus
      ref: 55de300a8627c55cd45ac86e6a26bcae8e0ca4cf # br_share_plus-v10.1.1_ohos
  wakelock_plus:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_wakelock_plus.git
      path: wakelock_plus
      ref: 7009f270c6bb1bb4aaf373e226a873a126f9b9f4 # br_v1.4.0_ohos
  audioplayers:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_audioplayers.git
      path: packages/audioplayers
      ref: 3a3e22642fac78dedb5fd4364b5ca29bcb144365 # tag 6.5.1-ohos-1.0.0
  audioplayers_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_audioplayers.git
      path: packages/audioplayers_ohos
      ref: 3a3e22642fac78dedb5fd4364b5ca29bcb144365
  audioplayers_android:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_audioplayers.git
      path: packages/audioplayers_android
      ref: 3a3e22642fac78dedb5fd4364b5ca29bcb144365

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon_foreground.png"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/profile_default.jpg
    - assets/icon.png
    - assets/sounds/
    - assets/backgrounds/
    - assets/island/
  shaders:
    - assets/shaders/edge_fade.frag

  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Light.ttf
          weight: 300
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
        - asset: fonts/Figtree-ExtraBold.ttf
          weight: 800
        - asset: fonts/Figtree-Black.ttf
          weight: 900
    - family: GoogleSansRounded
      fonts:
        - asset: fonts/GoogleSansRounded-Light.ttf
          weight: 300
        - asset: fonts/GoogleSansRounded-Regular.ttf
          weight: 400
        - asset: fonts/GoogleSansRounded-Medium.ttf
          weight: 500
        - asset: fonts/GoogleSansRounded-SemiBold.ttf
          weight: 600
        - asset: fonts/GoogleSansRounded-Bold.ttf
          weight: 700
        - asset: fonts/GoogleSansRounded-ExtraBold.ttf
          weight: 800
        - asset: fonts/GoogleSansRounded-Black.ttf
          weight: 900
    - family: GoogleSansFlex
      fonts:
        - asset: fonts/GoogleSansFlex.ttf
    - family: Nunito
      fonts:
        - asset: fonts/Nunito.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay.ttf
        - asset: fonts/PlayfairDisplay-Italic.ttf
          style: italic
